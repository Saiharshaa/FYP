# Default run configuration. Copy and edit per experiment; point
# $VERIFIER_CONFIG at the copy.
#
# Execution plan: model inference on TC1; ALL candidate-code execution in WSL2
# (Ubuntu 24.04), where unprivileged network namespaces are available.

[corpus]
# HumanEval/32 (find_zero): even with the evalplus find_zero fix pinned, the
# canonical solution fails 7/788 plus inputs, and >=2 of those (#119, #399)
# cannot be satisfied by any float64 answer (|poly(x)| <= 1e-4 is below the
# rounding floor), so every candidate would be labelled incorrect.
# Decision 2026-09-28; see notebook/LAB_NOTEBOOK.md.
exclude = ["HumanEval/32"]

[generation]
# Candidate pool: samples_per_temperature x len(temperatures) per problem
# (10 x 163 = 1630 with the defaults). Decision 2026-09-28.
temperatures = [0.2, 0.8]
samples_per_temperature = 5
max_tokens = 1024

[labelling]
# For a failing candidate, the first failing input is re-run in the sandbox
# with limit = evalplus per-test limit x timeout_multiplier; failure_category
# is "timeout" only if it exceeds that. The raw evalplus status is kept as the
# correctness label.
timeout_multiplier = 5
memory_mb = 4096             # matches evalplus's default 4 GB cap
# Serial by default: with 6 workers, 4/978 byte-identical canonical copies were
# labelled "fail" on evalplus time limits (load on this laptop's mixed P/E
# cores); 1 worker gave 0/978 twice. Decision 2026-09-30.
workers = 1

[sandbox]
# "docker" or "subprocess" (rlimits + network namespace).
backend = "subprocess"

[sandbox.docker]
image = "python:3.13-slim"   # TODO: pin by digest before the evaluation freeze
cpus = 1.0
pids_limit = 64

[sandbox.subprocess]
network = "auto"             # "namespace" | "python-guard" | "auto" (namespace if permitted)
# The python-guard fallback blocks sockets in-process only and is bypassable.
# The sandbox refuses to use it unless this is set to true.
allow_python_guard = false
