[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "verifier"
version = "0.1.0"
description = "Measuring the reliability of LLM code verifiers against EvalPlus ground truth"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # v0.3.1 + find_zero fix (#241); see LAB_NOTEBOOK 2026-09-26
    "evalplus @ git+https://github.com/evalplus/evalplus.git@6eb1e199c2e370518e7bf3e8eee6322c2b23c89c",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "linux: needs a POSIX host (resource/SIGALRM); skipped on Windows",
    "docker: needs a reachable Docker daemon",
    "slow: runs the full HumanEval+ suite (minutes)",
]
